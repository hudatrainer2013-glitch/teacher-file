<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ملف إنجاز المعلمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* model ج (chosen 2026-10-29): the Canva «ملف انجاز معلمة باللون الأخضر والزهري» look — watercolor flowers, pink/green, Lalezar titles */
:root{
  --green:#2f5d2a; --green-2:#4f7d3f; --leaf:#e6f0dc; --pink:#e7779a; --pink-l:#fde9ef;
  --lilac:#9b86d6; --lilac-l:#efeafb; --bg:#f7f8fd; --card:#fff; --ink:#2c3328; --muted:#6c7368; --line:#e8eae4;
}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
h1,h2,h3{font-family:"Lalezar","IBM Plex Sans Arabic",sans-serif;font-weight:400;color:var(--green);letter-spacing:0}
a{color:var(--green-2)}
.wrap{max-width:1100px;margin:auto;padding:0 16px}
header{background:#fff;border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;padding:14px 16px}
header h1{font-size:28px;margin:0;line-height:1.2}
header p{margin:0;color:var(--muted);font-size:14px}
.hero{position:relative;overflow:hidden;margin:18px 0;border-radius:22px;padding:24px;min-height:150px;display:flex;align-items:center;background:linear-gradient(120deg,var(--pink-l),var(--lilac-l))}
.hero img{position:absolute;left:-20px;bottom:-60px;width:210px}
.hero h2{font-size:34px;margin:0}
.hero p{margin:4px 0 0;max-width:460px}
.hero > div{position:relative;z-index:1}
.g{font-family:Lalezar,sans-serif;color:var(--green);font-size:24px;margin:24px 0 10px;display:flex;align-items:center;gap:8px}
.g::before{content:"";width:22px;height:22px;background:url(assets/bouquet.webp) center/contain no-repeat}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;color:var(--ink);border-top:5px solid var(--leaf);text-align:start;font:inherit;cursor:pointer;transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile.no{border-top-color:var(--pink)}
.tile b{display:block;font-weight:600}
.tile .n{font-size:22px;font-weight:700;color:var(--green)}
.tile.no .n{color:var(--pink)}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600}
.c-ok{background:var(--leaf);color:var(--green)}
.c-none{background:var(--pink-l);color:#b23a62}
.border-foot{height:150px;margin-top:20px;background:url(assets/border.webp) center bottom/auto 150px repeat-x}
.empty{text-align:center;color:var(--muted);padding:40px}
.btn{display:inline-block;border:0;border-radius:12px;padding:10px 18px;font:inherit;font-weight:600;background:var(--green);color:#fff;text-decoration:none;cursor:pointer}
.btn.ghost{background:var(--leaf);color:var(--green)}
.btn[aria-disabled=true]{opacity:.6;pointer-events:none}
/* section sheet */
dialog{border:0;border-radius:22px;padding:0;width:min(640px,calc(100% - 24px));max-height:calc(100% - 40px);box-shadow:0 20px 60px rgba(47,93,42,.25)}
dialog::backdrop{background:rgba(44,51,40,.35)}
.sh-h{position:relative;overflow:hidden;padding:20px 22px;background:linear-gradient(120deg,var(--pink-l),var(--lilac-l))}
.sh-h h2{margin:0;font-size:30px}
.sh-h img{position:absolute;left:-10px;top:-20px;width:110px;opacity:.9}
.sh-x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:#fff;color:var(--green);font-size:18px;cursor:pointer;z-index:1}
.sh-h h2,.sh-h p{position:relative;z-index:1;margin-inline-start:40px}
.sh-h p{margin-top:0;color:var(--muted)}
.sh-b{padding:16px 22px 22px}
.subs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.subs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font:inherit;cursor:pointer;color:var(--ink)}
.subs button.on{background:var(--green);border-color:var(--green);color:#fff}
.files{list-style:none;margin:0 0 14px;padding:0}
.files li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.files .x{font-size:11px;font-weight:700;background:var(--lilac-l);color:var(--lilac);border-radius:6px;padding:2px 6px;min-width:42px;text-align:center}
.files a{flex:1;text-decoration:none;color:var(--ink);word-break:break-word}
.files a:hover{color:var(--green)}
.files .d{color:var(--muted);font-size:12.5px;white-space:nowrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acts .muted{color:var(--muted);font-size:13px}
.credit{text-align:center;color:var(--muted);font-size:13px;margin-top:-30px;position:relative}
</style>
</head>
<body>
<header><div class="wrap"><img src="assets/bouquet.webp" alt="" style="width:44px">
  <div><h1>ملف إنجاز المعلمة</h1><p>أ. هدى محمد المساعد · ابتدائية ومتوسطة الراشدية · مديرة المدرسة: أ. مها الهذيلي</p></div></div></header>
<div class="wrap">
  <div class="hero">
    <div><h2>مرحبًا أ. هدى</h2><p>هنا باقة إنجازك لعام ١٤٤٨هـ، اختاري القسم لعرض ملفاته أو رفع ملف جديد.</p></div>
    <img src="assets/bouquet.webp" alt=""></div>
  <div id="secs"><div class="empty">جاري تحميل ملفاتك…</div></div>
</div>
<div class="border-foot"></div>

<dialog id="sheet">
  <div class="sh-h"><button class="sh-x" id="close" aria-label="إغلاق">✕</button><img src="assets/bouquet.webp" alt="">
    <h2 id="shT"></h2><p id="shP"></p></div>
  <div class="sh-b" id="shB"></div>
</dialog>

<script>
'use strict';
// هدى's Apps Script: ?app=tf lists «سجل إنجاز هدى لعام 1448هـ» folder by folder (key = 'section' or 'section/sub'); action tfupload saves into one key
const API = 'https://script.google.com/macros/s/AKfycbyWdWYwYhVpipy0uAl_FZMxUpcZZ2MFHvYM7TJMitINz8zY9NxeiOwQAN98V8i9rOkPPw/exec';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const hIso = t => { const P = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn', { day: 'numeric', month: 'numeric', year: 'numeric' }).formatToParts(new Date(t)), g = k => (P.find(q => q.type === k) || {}).value; return [g('day'), g('month'), g('year')].map(AR).join('‏/') + 'هـ'; };

const GRADES = ['أول متوسط', 'ثاني متوسط', 'ثالث متوسط'];
const SECTIONS = [
  { g: 'التعريف بالمعلمة', items: ['السيرة الذاتية', 'الرؤية والرسالة والقيم', 'أهداف المعلمة', 'أهداف سياسة التعليم', 'ميثاق أخلاقيات المهنة'] },
  { g: 'التطوير والتميّز', items: ['الدورات التدريبية', 'المؤتمرات والملتقيات', 'العضويات العلمية', 'الجوائز والإنجازات', 'شهادات الشكر والتقدير'] },
  { g: 'مجلدات السجل', items: ['توزيع المنهج', 'الخطة الفصلية', { t: 'الخطة الأسبوعية', subs: GRADES }, { t: 'الخطة العلاجية', subs: [...GRADES, 'خطة العلاج للطالبات'] },
    'الخطة الإثرائية', 'انماط التعلم', 'البرامج', 'المبادرات',
    { t: 'المجتمع المهني', subs: ['الحلقات التنشيطية', 'الدورات', 'دروس تطبيقية', 'زيارات تبادلية', 'ورش العمل'] }, { t: 'الإنتاج المعرفي', subs: ['دروس'] }] },
  { g: 'الملفات الختامية', items: ['التقويم الذاتي', 'نماذج من أوراق العمل', 'نماذج من الاختبارات', 'مشاركات المعلمة', 'الملاحق'] }
].map(s => ({ ...s, items: s.items.map(x => typeof x === 'string' ? { t: x, subs: null } : x) }));
const ALL = SECTIONS.flatMap(s => s.items);
const keysOf = x => x.subs ? x.subs.map(s => x.t + '/' + s) : [x.t];

let INFO = {}, cur = null, curSub = 0;
const filesOf = key => ((INFO[key] || {}).files || []);
const countOf = x => keysOf(x).reduce((a, k) => a + filesOf(k).length, 0);

async function load() {
  try {
    const r = await (await fetch(API + '?app=tf&t=' + Date.now())).json();
    if (!r.ok) throw new Error(r.error);
    INFO = r.folders;
  } catch (e) { $('#secs').innerHTML = '<div class="empty">تعذّر تحميل الملفات، تأكدي من الاتصال ثم حدّثي الصفحة</div>'; return; }
  render();
  if (cur) openSheet(cur, curSub);
}

function render() {
  let i = 0;
  $('#secs').innerHTML = SECTIONS.map(s => `<div class="g">${s.g}</div><div class="tiles">${s.items.map(x => { const n = countOf(x), k = ALL.indexOf(x);
    return `<button class="tile${n ? '' : ' no'}" data-k="${k}"><b>${esc(x.t)}</b><span class="n">${AR(n)}</span> <small>ملف</small>
      <div>${n ? '<span class="chip c-ok">مكتمل</span>' : '<span class="chip c-none">لم يُرفع</span>'}</div></button>`; }).join('')}</div>`).join('');
}

function openSheet(x, sub = 0) {
  cur = x; curSub = sub;
  const key = keysOf(x)[sub], files = [...filesOf(key)].sort((a, b) => b.t - a.t), url = (INFO[key] || {}).url;
  $('#shT').textContent = x.t;
  $('#shP').textContent = `${AR(countOf(x))} ملف`;
  $('#shB').innerHTML = `${x.subs ? `<div class="subs">${x.subs.map((s, i) => `<button data-sub="${i}" class="${i === sub ? 'on' : ''}">${esc(s)} (${AR(filesOf(x.t + '/' + s).length)})</button>`).join('')}</div>` : ''}
    ${files.length ? `<ul class="files">${files.map(f => `<li><span class="x">${esc(f.x || '—')}</span><a href="${esc(f.u)}" target="_blank" rel="noopener">${esc(f.n)}</a><span class="d">${hIso(f.t)}</span></li>`).join('')}</ul>`
      : '<div class="empty" style="padding:20px">لا توجد ملفات بعد</div>'}
    <div class="acts"><label class="btn" id="upBtn">رفع ملف${x.subs ? ` إلى «${esc(x.subs[sub])}»` : ''}<input type="file" id="upIn" multiple hidden></label>
      ${url ? `<a class="btn ghost" href="${esc(url)}" target="_blank" rel="noopener">فتح المجلد في Drive</a>` : ''}<span class="muted">حتى ٢٠ م.ب للملف</span></div>`;
  if (!$('#sheet').open) $('#sheet').showModal();
}

const b64 = file => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
async function upload(list) {
  const big = [...list].find(f => f.size > 20 * 1024 * 1024);
  if (big) return alert(`الملف «${big.name}» أكبر من ٢٠ م.ب`);
  const btn = $('#upBtn'); btn.setAttribute('aria-disabled', 'true'); btn.firstChild.textContent = 'جاري الرفع… ';
  try {
    const files = await Promise.all([...list].map(async f => ({ name: f.name, type: f.type, data: await b64(f) })));
    const r = await (await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'tfupload', key: keysOf(cur)[curSub], files }) })).json();
    if (!r.ok) throw new Error(r.error);
  } catch (e) { alert('ما تم الرفع، حاولي مرة ثانية. ' + e.message); }
  await load();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-k]'); if (t) return openSheet(ALL[+t.dataset.k]);
  const s = e.target.closest('[data-sub]'); if (s) return openSheet(cur, +s.dataset.sub);
});
document.addEventListener('change', e => { if (e.target.id === 'upIn' && e.target.files.length) upload(e.target.files); });
$('#close').onclick = () => { $('#sheet').close(); };
$('#sheet').addEventListener('close', () => { cur = null; });
$('#sheet').addEventListener('click', e => { if (e.target === $('#sheet')) $('#sheet').close(); });
load();
</script>
</body>
</html>
